{% extends "base.html" %}{% block c %}<h1>Finalizar pedido</h1><p>Total: <strong>{{ total|brl }}</strong> ({{ itens|length }} produto(s))</p>
<form method="post" class="form">
<label>Nome completo <input name="nome" value="{{ f.nome }}" required></label>
<label>E-mail <input type="email" name="email" value="{{ f.email }}" required></label>
<label>Telefone (com DDD) <input name="telefone" value="{{ f.telefone }}" required></label>
<label>Endereço de entrega <input name="endereco" value="{{ f.endereco }}" required></label>
<label>Pagamento <select name="pagamento" required>{% for x in formas %}<option value="{{ x }}" {{ 'selected' if f.pagamento==x }}>{{ x.title() }}</option>{% endfor %}</select></label>
<button>Confirmar pedido</button></form>{% endblock %}
