{% extends "base.html" %}{% block c %}<h1>Pedidos</h1><div class="scroll"><table><tr><th>#</th><th>Cliente</th><th>Total</th><th>Pagamento</th><th>Status</th></tr>
{% for p in pedidos %}<tr><td>{{ p.id_pedido }}</td><td>{{ p.nome }}</td><td>{{ p.total|brl }}</td><td>{{ p.forma_pagamento }}</td>
<td><form method="post" action="{{ url_for('main.admin_status', oid=p.id_pedido) }}"><select name="status">{% for s in status %}<option {{ 'selected' if s==p.status }}>{{ s }}</option>{% endfor %}</select><button class="sec">Salvar</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
