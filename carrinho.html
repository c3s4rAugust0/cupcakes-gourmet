{% extends "base.html" %}{% block c %}<h1>Carrinho</h1>
{% if itens %}<table><tr><th>Item</th><th>Qtd</th><th>Subtotal</th><th></th></tr>
{% for i in itens %}<tr><td>{{ i.p.nome }}</td><td>{{ i.qtd }}</td><td>{{ i.sub|brl }}</td>
<td><form method="post" action="{{ url_for('main.remover', pid=i.p.id_produto) }}"><button class="sec">Remover</button></form></td></tr>{% endfor %}
<tr><td colspan="2"><strong>Total</strong></td><td colspan="2"><strong>{{ total|brl }}</strong></td></tr></table>
<a class="btn" href="{{ url_for('main.checkout') }}">Finalizar pedido</a>
{% else %}<p>Seu carrinho está vazio. <a href="{{ url_for('main.catalogo') }}">Ver cupcakes</a></p>{% endif %}{% endblock %}
